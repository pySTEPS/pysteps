[build-system]
requires = [
    "wheel",
    "setuptools>=84",
    "Cython>=3",
    "numpy>=2",
]
build-backend = "setuptools.build_meta"

[project]
name = "PySTEPS"
description = "Python framework for short-term ensemble prediction systems"
keywords = ["advection", "ensemble prediction", "forecast verification", "hydrology", "nowcasting", "optical flow", "precipitation", "rainfall", "rainfall prediction", "stochastic processes", "weather", "weather radar",]
license = "BSD-3-Clause"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
readme = "README.rst"
version = "2.0.0-rc.1"
requires-python = ">=3.11.0,<3.14.0"
dependencies = [
    "jsmin==3.0.1",
    "jsonschema==4.26.0",
    "matplotlib==3.11.2",
    "netCDF4==1.7.5.1.post1",
    "numpy==2.4.6",
    "opencv-python==5.0.0.93",
    "pillow==13.0.0",
    "pyproj==3.7.2",
    "scipy==1.17.1",
    "xarray==2026.9.0",
]

[project.optional-dependencies]
optional = [
    "cartopy==0.26.0",
    "cookiecutter==2.7.1",
    "dask==2026.8.0",
    "geotiff==0.2.10",
    "h5py==3.16.0",
    "pandas==3.1.0",
    "pyfftw==0.15.1",
    "pywavelets==1.9.0",
    "rasterio==1.4.4",
    "scikit-image==0.26.0",
    "scikit-learn==1.9.1",
]
pygrib = [
    "pygrib==2.1.8"
]
gdal =[
    # gdal must match what's installed locally -- see add_gdal[_brew].sh
    "pip==26.3",
    "setuptools==84.2.1",
    "wheel==0.48.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[project.urls]
Homepage = "https://github.com/you/my-package"
Source = "https://github.com/pySTEPS/pysteps"
Issues = "https://github.com/pySTEPS/pysteps/issues"
CI = "https://github.com/pySTEPS/pysteps/actions"
Changelog = "https://github.com/pySTEPS/pysteps/releases"
Documentation = "https://pysteps.readthedocs.io"

#########################################################################################
# Style checking
#########################################################################################

[tool.bandit]
assert_used = { skips = ["*/test_*.py"] }
skips = [
    # 2026-10-04: These are allowed so the tests can pass. Please check this list for unwanted issues.
    'B101',  # allow asserts
    'B301',  # allow pickles
    'B403',  # allow pickle to be imported
    'B603',  # allow subprocess
    'B404',  # allow subprocess to be imported
    'B607',  # allow process to start with partial path\
    'B310',  # allow request.urlretrieve
]
exclude_dirs = [
    ".venv",
    "dist",
    "pysteps/tests"
]

[tool.ruff]
line-length = 88
# In addition to the standard set of exclusions, omit build and dist
extend-exclude = [
    "*build",
    "*dist",
]

[tool.ruff.lint]
select = [
    "I",  # sort imports!
]

[tool.ruff.format]
# Use `\n` line endings for all files
line-ending = "lf"
