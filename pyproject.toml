[build-system]
requires = [
    "wheel",
    "setuptools>=40.8.0",
    "Cython>=0.29.2",
    "numpy>=1.13"
]
# setuptools 40.8.0 is the first version of setuptools that offers
# a PEP 517 backend that closely mimics directly executing setup.py.
build-backend = "setuptools.build_meta:__legacy__"
#https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support


# Define black parameters for the project
# https://black.readthedocs.io/en/stable/pyproject_toml.html#configuration-format
[tool.black]
target-version = ['py36']
line-length = 88
exclude = '''
/(
    \.eggs
  | \.git
  | _build
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
builtins = ["ellipsis"]
exclude = [
    ".eggs",
    "doc",
]

[tool.ruff.lint]
# E402: module level import not at top of file
# E501: line too long - let black worry about that
# E731: do not assign a lambda expression, use a def
ignore = [
    "E402",
    "E501",
    "E731",
]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "I",
    # Pyupgrade
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["pysteps"]
