[build-system]
requires = [
    "wheel",
    "setuptools>=40.8.0",
    "Cython>=0.29.2",
    "numpy>=1.13"
]
# setuptools 40.8.0 is the first version of setuptools that offers
# a PEP 517 backend that closely mimics directly executing setup.py.
build-backend = "setuptools.build_meta:__legacy__"
#https://pip.pypa.io/en/stable/reference/pip/#pep-517-and-518-support

[project]
name = "PySTEPS"
keywords = ["advention", "ensemble-prediction", "forecast-verification", "hydrology", "nowcasting", "optical-flow", "precipitation", "rainfall", "rainfall-prediction", "stochastic-processes", "weather", "weather-radar"]
license = { text = "BSD-3-Clause" }
readme = "README.rst"
version = "2.0.0"
requires-python = ">=3.11.0,<3.14.0"
dependencies = [
    "cartopy>=0.18",
    "dask",
    "gdal==3.4.1",
    "geotiff",
    "h5py",
    "jsmin",
    "jsonschema",
    "matplotlib",
    "netCDF4",
    "numpy",
    "opencv-python",
    "pandas",
    "pillow",
    "pyfftw",
    "pygrib",
    "pyproj",
    "pywavelets",
    "rasterio",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "xarray",
]

[dependency-groups]
dev = [
    "bandit",
    "cookiecutter",
    "pre-commit",
    "pytest",
    "ruff",
]

#########################################################################################
# Style checking
#########################################################################################

[tool.bandit]
assert_used = { skips = ["*/test_*.py"] }
exclude_dirs = [".venv"]

[tool.ruff]
line-length = 88
# In addition to the standard set of exclusions, omit build and dist
extend-exclude = [
    "*build",
    "*dist",
]

[tool.ruff.lint]
select = [
    "I",  # sort imports!
]

[tool.ruff.format]
# Use `\n` line endings for all files
line-ending = "lf"
