repos:
  - repo: local
    hooks:
      - id: run-bandit
        name: run-bandit
        entry: uv run bandit -c bandit.yaml .
        language: system
        verbose: true
        pass_filenames: false
        stages: [ pre-commit ]
  - repo: local
    hooks:
      - id: sort-imports
        name: sort-imports
        entry: uv run ruff check --fix
        language: system
        verbose: true
        pass_filenames: false
        stages: [ pre-commit ]
  - repo: local
    hooks:
      - id: run-ruff
        name: run-ruff
        entry: uv run ruff format
        language: system
        verbose: true
        pass_filenames: false
        stages: [ pre-commit ]
