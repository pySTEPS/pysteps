repos:
  - repo: local
    hooks:
      - id: run-bandit
        name: run-bandit
        entry: bandit -c pyproject.toml -r .
        language: python
        additional_dependencies: [bandit]
        verbose: true
        pass_filenames: false
        stages: [pre-commit]

      - id: sort-imports
        name: sort-imports
        entry: ruff check --fix
        language: python
        additional_dependencies: [ruff]
        verbose: true
        pass_filenames: false
        stages: [pre-commit]

      - id: run-ruff
        name: run-ruff
        entry: ruff format
        language: python
        additional_dependencies: [ruff]
        verbose: true
        pass_filenames: false
        stages: [pre-commit]
