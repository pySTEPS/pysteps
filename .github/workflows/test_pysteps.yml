name: Test pysteps

on:
  # Triggers the workflow on push or pull request events to the master branch
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  formatting_checks:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      -   uses: actions/checkout@v7
      -   name: Install uv
          uses: astral-sh/setup-uv@v10.3.3
      -   name: Sync uv
          working-directory: ${{github.workspace}}
          run: uv sync --only-dev --frozen
      -   name: Run bandit
          working-directory: ${{github.workspace}}
          run: uv run bandit -c pyproject.toml -r .
      -   name: Run import sorter
          working-directory: ${{github.workspace}}
          run: uv run --no-sync ruff check
      -   name: Run ruff
          working-directory: ${{github.workspace}}
          run: uv run --no-sync ruff format --check

  unit_tests:
    name: Unit Tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: formatting_checks

    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        python-version: ["3.11", "3.13"]
      max-parallel: 6

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{github.workspace}}
        run: |
          sudo apt update
          sudo apt install libgdal-dev libproj-dev libhdf5-dev libopencv-dev libeccodes-dev

      - name: Install pygrib
        run: mamba install --quiet pygrib

      - name: Install pysteps (MacOS)
        if: matrix.os == 'macos-latest'
        working-directory: ${{github.workspace}}
        env:
          CC: gcc-13
          CXX: g++-13
          CXX1X: g++-13
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew update-reset
          brew update
          gcc-13 --version || brew install gcc@13
          brew install gdal
          uv python install ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }} --frozen
          bash add_gdal_brew.sh
          uv sync --python ${{ matrix.python-version }} --all-extras --frozen

      - name: Install pysteps (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ${{github.workspace}}
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }} --frozen
          bash add_gdal.sh
          uv sync --python ${{ matrix.python-version }} --all-extras --frozen

      - name: Install pysteps (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ${{github.workspace}}
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync --python ${{ matrix.python-version }} --frozen
          uv sync --python ${{ matrix.python-version }} --extra optional --extra gdal --frozen

      - name: Download pysteps data
        env:
          PYSTEPS_DATA_PATH: ${{github.workspace}}/pysteps_data
        working-directory: ${{github.workspace}}/ci
        run: uv run fetch_pysteps_data.py

      - name: Check imports
        working-directory: ${{github.workspace}}/pysteps_data
        run: |
          uv run python --version
          uv run python -c "import pysteps; print(pysteps.__file__)"
          uv run python -c "from pysteps import motion"
          uv run python -c "from pysteps.motion import vet"
          uv run python -c "from pysteps.motion import proesmans"

      - name: Run tests and coverage report
        working-directory: ${{github.workspace}}/pysteps_data
        env:
          PYSTEPSRC: ${{github.workspace}}/pysteps_data/pystepsrc
          PYSTEPS_REPO_ROOT: ${{github.workspace}}
        run: uv run pytest --pyargs pysteps --cov=pysteps --cov-report=xml --cov-report=term -ra

      - name: Upload coverage to Codecov (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        env:
          OS: ${{ matrix.os }}
          PYTHON: ${{ matrix.python-version }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{github.workspace}}/pysteps_data/coverage.xml
          flags: unit_tests
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          verbose: true
